<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Samarpan</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>

<body>

    <div class="login-box">
        <h2>Admin Login</h2>

        <input type="text" id="username" placeholder="Enter Username">
        <input type="password" id="password" placeholder="Enter Password">

        <button id="login-btn" class="login-btn">Login</button>

        <div class="error-message" id="error"></div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $("#login-btn").click(function () {
            var user = $("#username").val();
            var pass = $("#password").val();

            if (!user || !pass) {
                $("#error").html("Please enter both username and password.");
                return;
            }

            // Secure login via backend API
            $.ajax({
                url: '/api/admin/login',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: user, password: pass }),
                success: function (response) {
                    if (response.success) {
                        // Redirects to /admin/admin-dashboard.html?user=...
                        window.location.href = response.redirect;
                    } else {
                        $("#error").html(response.message || "Invalid credentials");
                    }
                },
                error: function (xhr) {
                    var errorMsg = "Invalid username or password";
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMsg = xhr.responseJSON.message;
                    }
                    $("#error").html(errorMsg);
                }
            });
        });
    </script>
</body>

</html>
